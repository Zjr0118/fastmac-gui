name: mac
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v2
    - name: Setting the environment up.
      env:
        VNC_USER_PASSWORD: ${{ secrets.VNC_USER_PASSWORD }}
        VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
      run: source configure.sh "$VNC_USER_PASSWORD" "$VNC_PASSWORD"
    - name: Build issue body
      run: |
        VNC_ADDR=$(grep -hoE 'bore\.pub:[0-9]+' /tmp/bore_vnc.log 2>/dev/null | head -1 || true)
        SSH_ADDR=$(grep -hoE 'bore\.pub:[0-9]+' /tmp/bore_ssh.log 2>/dev/null | head -1 || true)
        {
          echo "VNC address: $VNC_ADDR  (RealVNC: host::port, password: vnc2026x)"
          echo
          echo "SSH address: $SSH_ADDR  (user: vncuser, password: MacVnc2026!)"
          echo
          echo "--- vnc tunnel log ---"
          cat /tmp/bore_vnc.log 2>/dev/null || true
          echo
          echo "--- ssh tunnel log ---"
          cat /tmp/bore_ssh.log 2>/dev/null || true
        } > /tmp/issue_body.txt
    - name: Report tunnels to issue
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh issue create -R "${{ github.repository }}" --title "VNC+SSH Tunnel $(date -u +%Y%m%d%H%M%S)" --body-file /tmp/issue_body.txt
    - name: Keep alive
      run: sleep 3600
